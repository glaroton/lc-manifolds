name = "lc-manifolds"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LocallyConvexManifolds"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "lc-analysis"
git = "https://github.com/glaroton/lc-analysis"
rev = "main"

[[lean_lib]]
name = "LocallyConvexManifolds"
